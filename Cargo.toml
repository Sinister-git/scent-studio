[package]
name = "scentctl"
version = "0.2.0"
edition = "2021"
description = "Local BLE and account-based controls for Scent Master Pro diffusers"

[[bin]]
name = "scent-studio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
btleplug = "0.11.8"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
chrono = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = "1"
